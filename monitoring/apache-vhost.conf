# Replaces the image's default vhost (/etc/apache2/sites-available/000-default.conf).
# The only change is the second CustomLog: a compact access log (method, final status code, request time in
# microseconds) written to a volume shared with the mtail sidecar. A global CustomLog would not work here,
# because a vhost that defines its own CustomLog does not inherit the global one.
LogFormat "%m %>s %D" guestbook_metrics

<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	CustomLog /var/log/guestbook/access.log guestbook_metrics
</VirtualHost>
